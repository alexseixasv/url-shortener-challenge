services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT}:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL}
      ANALYTICS_ENQUEUE_TIMEOUT_MS: ${ANALYTICS_ENQUEUE_TIMEOUT_MS:-0}
      RATE_LIMIT_POST_LINKS_MAX: ${RATE_LIMIT_POST_LINKS_MAX:-30}
      RATE_LIMIT_POST_LINKS_WINDOW_SECONDS: ${RATE_LIMIT_POST_LINKS_WINDOW_SECONDS:-60}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Default origin tracks WEB_PORT; set CORS_ORIGIN explicitly to override.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - api_node_modules:/app/apps/api/node_modules

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      ANALYTICS_CONSUMER_NAME: ${ANALYTICS_CONSUMER_NAME:-worker-1}
      ANALYTICS_PENDING_IDLE_MS: ${ANALYTICS_PENDING_IDLE_MS:-60000}
      ANALYTICS_MAX_ATTEMPTS: ${ANALYTICS_MAX_ATTEMPTS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - api_node_modules:/app/apps/api/node_modules
    command: ["pnpm", "exec", "nest", "start", "--entryFile", "worker.main", "--watch", "--no-shell"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Browser on the host calls published API port — not the Compose hostname "api".
      # Default tracks API_PORT; set VITE_API_BASE_URL explicitly to override.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_PORT}}
    volumes:
      - ./apps/web:/app/apps/web
      - web_node_modules:/app/apps/web/node_modules

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
